name: Bibi
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.30.0
configs:
  Debug: debug
  Release: release
  OnlineAcceptance: debug
fileGroups:
  - Configuration
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  preGenCommand: python3 scripts/prepare_asset_catalog.py
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
targets:
  Bibi:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.Push:
          enabled: 1
    sources:
      - path: Bibi
        excludes:
          - Support/Info.plist
          - Support/Bibi.entitlements
      - path: .generated/Assets.xcassets
        buildPhase: resources
      - path: ../Assets/Kalam-OFL.txt
        buildPhase: resources
      - path: ../Assets/Kalam-Bold.ttf
        buildPhase: resources
      - path: ../Assets/ComicNeue-OFL.txt
        buildPhase: resources
      - path: ../Assets/ComicNeue-Regular.ttf
        buildPhase: resources
      - path: ../Assets/PrivacyPolicy.pdf
        buildPhase: resources
      - path: ../Assets/TermsOfService.pdf
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    preBuildScripts:
      - name: Prepare asset catalog
        script: |
          /usr/bin/python3 "$SRCROOT/scripts/prepare_asset_catalog.py"
          /usr/bin/python3 "$SRCROOT/scripts/prepare_online_acceptance.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Bibi
        PRODUCT_BUNDLE_IDENTIFIER: com.bibi.quadratic
        DEVELOPMENT_TEAM: JPTS6M4T5B
        INFOPLIST_FILE: Bibi/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bibi/Support/Bibi.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        OnlineAcceptance:
          INFOPLIST_FILE: .generated/OnlineAcceptance-Info.plist
          BIBI_APNS_ENVIRONMENT: development
        Debug:
          BIBI_APNS_ENVIRONMENT: development
        Release:
          BIBI_APNS_ENVIRONMENT: production
  BibiBackendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Backend
    dependencies:
      - target: Bibi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibi.quadratic.backend-tests
        GENERATE_INFOPLIST_FILE: true
  BibiTypographyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Typography
    dependencies:
      - target: Bibi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibi.quadratic.typography-tests
        GENERATE_INFOPLIST_FILE: true
  BibiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Bibi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibi.quadratic.ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Bibi
  BibiPurchaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/Purchases
      - path: Configuration/BibiDiamonds.storekit
        buildPhase: resources
    dependencies:
      - target: Bibi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibi.quadratic.purchase-ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Bibi
schemes:
  Bibi:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/BibiDiamonds.storekit
    test:
      config: Debug
      targets:
        - BibiTypographyTests
        - BibiBackendTests
        - BibiUITests
    archive:
      config: Release
  BibiAppStore:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
    archive:
      config: Release
  BibiPurchases:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/BibiDiamonds.storekit
    test:
      config: Debug
      targets:
        - BibiPurchaseUITests

  BibiPurchaseValidation:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
      environmentVariables:
        BIBI_OFFLINE_PURCHASE_VALIDATION: "1"
    test:
      config: Debug
      environmentVariables:
        BIBI_OFFLINE_PURCHASE_VALIDATION: "1"
      targets:
        - BibiBackendTests

  BibiOnlineAcceptance:
    build:
      targets:
        Bibi: all
    run:
      config: OnlineAcceptance
