name: Bibi
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
targets:
  Bibi:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    sources:
      - path: Bibi
        excludes:
          - Support/Info.plist
      - path: Agreements
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Bibi
        PRODUCT_BUNDLE_IDENTIFIER: im.seex.sao2-neiku-30
        DEVELOPMENT_TEAM: JPTS6M4T5B
        INFOPLIST_FILE: Bibi/Support/Info.plist
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Bibi:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
    archive:
      config: Release
