name: Bibi
fileGroups:
  - Configuration
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  preGenCommand: python3 scripts/prepare_asset_catalog.py
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
targets:
  Bibi:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    sources:
      - path: Bibi
        excludes:
          - Support/Info.plist
      - path: .generated/Assets.xcassets
        buildPhase: resources
      - path: ../Assets/Fredoka-OFL.txt
        buildPhase: resources
      - path: ../Assets/Fredoka-Variable.ttf
        buildPhase: resources
      - path: ../Assets/Nunito-OFL.txt
        buildPhase: resources
      - path: ../Assets/Nunito-Variable.ttf
        buildPhase: resources
      - path: ../Assets/PrivacyPolicy.html
        buildPhase: resources
      - path: ../Assets/TermsOfService.html
        buildPhase: resources
      - path: ../Assets/animation-catalog.json
        buildPhase: resources
      - path: ../Assets/bibi-amber-city.jpg
        buildPhase: resources
      - path: ../Assets/bibi-amber-city.mp4
        buildPhase: resources
      - path: ../Assets/bibi-ancient-roots.jpg
        buildPhase: resources
      - path: ../Assets/bibi-ancient-roots.mp4
        buildPhase: resources
      - path: ../Assets/bibi-blue-horizon.jpg
        buildPhase: resources
      - path: ../Assets/bibi-blue-horizon.mp4
        buildPhase: resources
      - path: ../Assets/bibi-clockwork-streets.jpg
        buildPhase: resources
      - path: ../Assets/bibi-clockwork-streets.mp4
        buildPhase: resources
      - path: ../Assets/bibi-dawn-promise.jpg
        buildPhase: resources
      - path: ../Assets/bibi-dawn-promise.mp4
        buildPhase: resources
      - path: ../Assets/bibi-forest-guardian.jpg
        buildPhase: resources
      - path: ../Assets/bibi-forest-guardian.mp4
        buildPhase: resources
      - path: ../Assets/bibi-forest-path.jpg
        buildPhase: resources
      - path: ../Assets/bibi-forest-path.mp4
        buildPhase: resources
      - path: ../Assets/bibi-glowing-staff.jpg
        buildPhase: resources
      - path: ../Assets/bibi-glowing-staff.mp4
        buildPhase: resources
      - path: ../Assets/bibi-green-world.jpg
        buildPhase: resources
      - path: ../Assets/bibi-green-world.mp4
        buildPhase: resources
      - path: ../Assets/bibi-little-companion.jpg
        buildPhase: resources
      - path: ../Assets/bibi-little-companion.mp4
        buildPhase: resources
      - path: ../Assets/bibi-moonlit-mist.jpg
        buildPhase: resources
      - path: ../Assets/bibi-moonlit-mist.mp4
        buildPhase: resources
      - path: ../Assets/bibi-paper-sky.jpg
        buildPhase: resources
      - path: ../Assets/bibi-paper-sky.mp4
        buildPhase: resources
      - path: ../Assets/bibi-quiet-return.jpg
        buildPhase: resources
      - path: ../Assets/bibi-quiet-return.mp4
        buildPhase: resources
      - path: ../Assets/bibi-shared-light.jpg
        buildPhase: resources
      - path: ../Assets/bibi-shared-light.mp4
        buildPhase: resources
      - path: ../Assets/bibi-sky-chase.jpg
        buildPhase: resources
      - path: ../Assets/bibi-sky-chase.mp4
        buildPhase: resources
      - path: ../Assets/bibi-spring-awakens.jpg
        buildPhase: resources
      - path: ../Assets/bibi-spring-awakens.mp4
        buildPhase: resources
      - path: ../Assets/runtime-asset-inventory.json
        buildPhase: resources
    preBuildScripts:
      - name: Prepare asset catalog
        script: /usr/bin/python3 "$SRCROOT/scripts/prepare_asset_catalog.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Bibi
        PRODUCT_BUNDLE_IDENTIFIER: im.seex.sao2-neiku-30
        DEVELOPMENT_TEAM: JPTS6M4T5B
        INFOPLIST_FILE: Bibi/Support/Info.plist
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  BibiTypographyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Typography
    dependencies:
      - target: Bibi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.seex.sao2-neiku-30.typography-tests
        GENERATE_INFOPLIST_FILE: true
  BibiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Bibi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.seex.sao2-neiku-30.ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Bibi
  BibiPurchaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/Purchases
      - path: Configuration/BibiDiamonds.storekit
        buildPhase: resources
    dependencies:
      - target: Bibi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.seex.sao2-neiku-30.purchase-ui-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Bibi
schemes:
  Bibi:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/BibiDiamonds.storekit
    test:
      config: Debug
      targets:
        - BibiTypographyTests
        - BibiUITests
    archive:
      config: Release
  BibiAppStore:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
    archive:
      config: Release
  BibiPurchases:
    build:
      targets:
        Bibi: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/BibiDiamonds.storekit
    test:
      config: Debug
      targets:
        - BibiPurchaseUITests
